<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bg-home" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#14110d" stop-opacity="1"/>
      <stop offset="100%" stop-color="#060504" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="warm-orb" cx="50%" cy="44%" r="50%">
      <stop offset="0%" stop-color="#C9A84C" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#C9A84C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar-fade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#C9A84C" stop-opacity="0"/>
      <stop offset="25%"  stop-color="#C9A84C" stop-opacity="0.05"/>
      <stop offset="75%"  stop-color="#C9A84C" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#C9A84C" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-home)"/>
  <ellipse cx="600" cy="290" rx="540" ry="300" fill="url(#warm-orb)"/>

  <!-- Brand watermark: oversized pause bars spanning full card height -->
  <rect x="477" y="0" width="88" height="630" fill="url(#bar-fade)"/>
  <rect x="635" y="0" width="88" height="630" fill="url(#bar-fade)"/>

  <!-- Fine horizontal rules -->
  <line x1="80" y1="110" x2="1120" y2="110" stroke="#C9A84C" stroke-width="0.5" stroke-opacity="0.25"/>
  <line x1="80" y1="520" x2="1120" y2="520" stroke="#C9A84C" stroke-width="0.5" stroke-opacity="0.25"/>

  <!-- Corner marks -->
  <path d="M80,140 L80,130 L90,130"   fill="none" stroke="#C9A84C" stroke-width="1" stroke-opacity="0.3"/>
  <path d="M1120,140 L1120,130 L1110,130" fill="none" stroke="#C9A84C" stroke-width="1" stroke-opacity="0.3"/>
  <path d="M80,490 L80,500 L90,500"   fill="none" stroke="#C9A84C" stroke-width="1" stroke-opacity="0.3"/>
  <path d="M1120,490 L1120,500 L1110,500" fill="none" stroke="#C9A84C" stroke-width="1" stroke-opacity="0.3"/>

  <!-- ODC logo mark — top-left, correct geometry -->
  <g transform="translate(80, 52)">
    <polygon points="32,5 59,20 59,51 32,66 5,51 5,20"
             fill="none" stroke="#2E6070" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="55,35.5 43.5,15.6 20.5,15.6 9,35.5 20.5,55.4 43.5,55.4"
             fill="none" stroke="#2E6070" stroke-width="4" stroke-linejoin="round"/>
    <rect x="24" y="26" width="6" height="19" rx="1" fill="#C05530"/>
    <rect x="33" y="26" width="6" height="19" rx="1" fill="#C05530"/>
  </g>

  <!-- Wordmark + URL — top-left -->
  <text x="150" y="80" font-family="Georgia, 'Times New Roman', serif"
        font-size="11" fill="#C9A84C" fill-opacity="0.7" letter-spacing="4">OFF DAY COLLECTIVE</text>
  <line x1="150" y1="91" x2="375" y2="91" stroke="#C9A84C" stroke-width="0.5" stroke-opacity="0.3"/>
  <text x="150" y="103" font-family="Georgia, 'Times New Roman', serif"
        font-size="9" fill="#C9A84C" fill-opacity="0.35" letter-spacing="2.5">offdaycollective.com</text>

  <!-- Volume / season label — top-right -->
  <text x="1120" y="80" font-family="Georgia, 'Times New Roman', serif"
        font-size="9" fill="#C9A84C" fill-opacity="0.35" letter-spacing="2.5" text-anchor="end">VOLUME ONE · FALL 2026</text>

  <!-- Hero content — centred -->

  <!-- Label above headline -->
  <text x="600" y="200" font-family="Georgia, 'Times New Roman', serif"
        font-size="11" fill="#C9A84C" fill-opacity="0.5" letter-spacing="6" text-anchor="middle">EDUCATION · COMMUNITY · TOOLS</text>

  <!-- Main headline -->
  <text x="600" y="302" font-family="Georgia, 'Times New Roman', serif"
        font-size="84" font-style="italic" fill="#F0EDE6" fill-opacity="0.96"
        letter-spacing="-1.5" text-anchor="middle">Silence is</text>
  <text x="600" y="390" font-family="Georgia, 'Times New Roman', serif"
        font-size="84" font-style="italic" fill="#F0EDE6" fill-opacity="0.96"
        letter-spacing="-1.5" text-anchor="middle">a Luxury.</text>

  <!-- Accent rule -->
  <line x1="530" y1="413" x2="670" y2="413" stroke="#C9A84C" stroke-width="0.75" stroke-opacity="0.5"/>

  <!-- Tagline -->
  <text x="600" y="442" font-family="Georgia, 'Times New Roman', serif"
        font-size="16" fill="#F0EDE6" fill-opacity="0.36" letter-spacing="0.3" text-anchor="middle">Science-backed writing, shared rituals, and objects for the pause.</text>

  <!-- Bottom label -->
  <text x="600" y="548" font-family="Georgia, 'Times New Roman', serif"
        font-size="11" fill="#C9A84C" fill-opacity="0.45" letter-spacing="3.5" text-anchor="middle">JOIN THE COLLECTIVE · OFFDAYCOLLECTIVE.COM</text>
</svg>
