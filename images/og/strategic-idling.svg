<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="midglow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#0d1a0e" stop-opacity="1"/>
      <stop offset="100%" stop-color="#060806" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="sage-orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8FAF90" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#8FAF90" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#midglow)"/>
  <ellipse cx="600" cy="315" rx="450" ry="220" fill="url(#sage-orb)"/>

  <!-- Fine rules -->
  <line x1="80" y1="110" x2="1120" y2="110" stroke="#8FAF90" stroke-width="0.5" stroke-opacity="0.2"/>
  <line x1="80" y1="520" x2="1120" y2="520" stroke="#8FAF90" stroke-width="0.5" stroke-opacity="0.2"/>

  <!-- BRAC sinusoidal wave — full width, centered vertically in bottom third -->
  <!-- Wave 1: primary, brighter -->
  <path d="M 60,440 C 120,440 150,390 210,390 C 270,390 300,440 360,440 C 420,440 450,390 510,390 C 570,390 600,440 660,440 C 720,440 750,390 810,390 C 870,390 900,440 960,440 C 1020,440 1050,390 1110,390 C 1140,390 1160,415 1160,415"
        fill="none" stroke="#8FAF90" stroke-width="2" stroke-opacity="0.5"/>
  <!-- Wave 2: offset phase, dimmer -->
  <path d="M 60,460 C 120,460 150,415 210,415 C 270,415 300,460 360,460 C 420,460 450,415 510,415 C 570,415 600,460 660,460 C 720,460 750,415 810,415 C 870,415 900,460 960,460 C 1020,460 1050,415 1110,415 C 1140,415 1160,435 1160,435"
        fill="none" stroke="#8FAF90" stroke-width="1" stroke-opacity="0.2"/>
  <!-- Wave 3: fill suggestion below wave 1 -->
  <path d="M 60,440 C 120,440 150,390 210,390 C 270,390 300,440 360,440 C 420,440 450,390 510,390 C 570,390 600,440 660,440 C 720,440 750,390 810,390 C 870,390 900,440 960,440 C 1020,440 1050,390 1110,390 C 1140,390 1160,415 1160,415 L 1160,480 L 60,480 Z"
        fill="#8FAF90" fill-opacity="0.04"/>

  <!-- 90-min cycle markers on wave -->
  <circle cx="210" cy="390" r="3" fill="#8FAF90" fill-opacity="0.5"/>
  <circle cx="510" cy="390" r="3" fill="#8FAF90" fill-opacity="0.5"/>
  <circle cx="810" cy="390" r="3" fill="#8FAF90" fill-opacity="0.5"/>
  <circle cx="1110" cy="390" r="3" fill="#8FAF90" fill-opacity="0.5"/>

  <!-- Cycle label -->
  <text x="210" y="378" font-family="Georgia, 'Times New Roman', serif" font-size="9" fill="#8FAF90" fill-opacity="0.4" letter-spacing="2" text-anchor="middle">90 MIN</text>
  <text x="510" y="378" font-family="Georgia, 'Times New Roman', serif" font-size="9" fill="#8FAF90" fill-opacity="0.4" letter-spacing="2" text-anchor="middle">90 MIN</text>
  <text x="810" y="378" font-family="Georgia, 'Times New Roman', serif" font-size="9" fill="#8FAF90" fill-opacity="0.4" letter-spacing="2" text-anchor="middle">90 MIN</text>

  <!-- ODC logo mark -->
  <g transform="translate(80, 52)">
    <polygon points="32,5 59,20 59,51 32,66 5,51 5,20" fill="none" stroke="#2E6070" stroke-width="4" stroke-linejoin="round"/>
    <polygon points="55,35.5 43.5,15.6 20.5,15.6 9,35.5 20.5,55.4 43.5,55.4" fill="none" stroke="#2E6070" stroke-width="4" stroke-linejoin="round"/>
    <rect x="24" y="26" width="6" height="19" rx="1" fill="#C05530"/>
    <rect x="33" y="26" width="6" height="19" rx="1" fill="#C05530"/>
  </g>

  <!-- Series label -->
  <text x="150" y="88" font-family="Georgia, 'Times New Roman', serif" font-size="10" fill="#8FAF90" fill-opacity="0.5" letter-spacing="4">THE SCIENCE OF REST · VOL. I</text>

  <!-- Article number -->
  <text x="600" y="216" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#8FAF90" fill-opacity="0.45" letter-spacing="5" text-anchor="middle">No. 2 · Midday</text>

  <!-- Main headline -->
  <text x="600" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="56" fill="#F0EDE6" fill-opacity="0.97" letter-spacing="-0.5" text-anchor="middle">The Art of</text>
  <text x="600" y="358" font-family="Georgia, 'Times New Roman', serif" font-size="56" fill="#F0EDE6" fill-opacity="0.97" letter-spacing="-0.5" text-anchor="middle">Strategic Idling.</text>

  <!-- Reading time -->
  <text x="600" y="548" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#8FAF90" fill-opacity="0.4" letter-spacing="3" text-anchor="middle">10 MIN READ · MARCH 2026</text>

  <!-- Corner marks -->
  <path d="M80,140 L80,130 L90,130" fill="none" stroke="#8FAF90" stroke-width="1" stroke-opacity="0.25"/>
  <path d="M1120,140 L1120,130 L1110,130" fill="none" stroke="#8FAF90" stroke-width="1" stroke-opacity="0.25"/>
  <path d="M80,490 L80,500 L90,500" fill="none" stroke="#8FAF90" stroke-width="1" stroke-opacity="0.25"/>
  <path d="M1120,490 L1120,500 L1110,500" fill="none" stroke="#8FAF90" stroke-width="1" stroke-opacity="0.25"/>
</svg>
