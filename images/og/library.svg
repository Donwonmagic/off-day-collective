<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="60%" r="55%">
      <stop offset="0%" stop-color="#1a1208" stop-opacity="1"/>
      <stop offset="100%" stop-color="#060606" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C9A84C" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#C9A84C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-glow)"/>

  <!-- Ambient orb -->
  <ellipse cx="600" cy="380" rx="420" ry="260" fill="url(#orb)"/>

  <!-- Fine horizontal rule lines — editorial texture -->
  <line x1="80" y1="110" x2="1120" y2="110" stroke="#C9A84C" stroke-width="0.5" stroke-opacity="0.25"/>
  <line x1="80" y1="520" x2="1120" y2="520" stroke="#C9A84C" stroke-width="0.5" stroke-opacity="0.25"/>

  <!-- ODC logo mark — top left -->
  <g transform="translate(80, 52)">
    <polygon points="32,5 59,20 59,51 32,66 5,51 5,20" fill="none" stroke="#2E6070" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="44,14 55,32 44,50 20,50 9,32 20,14" fill="none" stroke="#2E6070" stroke-width="3" stroke-linejoin="round"/>
    <rect x="26" y="24" width="5" height="16" rx="1" fill="#C05530"/>
    <rect x="33" y="24" width="5" height="16" rx="1" fill="#C05530"/>
  </g>

  <!-- ODC wordmark -->
  <text x="150" y="88" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#C9A84C" fill-opacity="0.6" letter-spacing="4" text-transform="uppercase">OFF DAY COLLECTIVE</text>

  <!-- Divider after wordmark -->
  <line x1="150" y1="97" x2="360" y2="97" stroke="#C9A84C" stroke-width="0.5" stroke-opacity="0.3"/>

  <!-- Series label -->
  <text x="600" y="245" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#C9A84C" fill-opacity="0.55" letter-spacing="6" text-anchor="middle">THE SCIENCE OF REST</text>

  <!-- Main headline -->
  <text x="600" y="340" font-family="Georgia, 'Times New Roman', serif" font-size="72" fill="#F0EDE6" fill-opacity="0.96" letter-spacing="-1" text-anchor="middle">The Library.</text>

  <!-- Subtext -->
  <text x="600" y="398" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#F0EDE6" fill-opacity="0.38" letter-spacing="0.5" text-anchor="middle">Science-backed writing on rest, rhythm, and recovery.</text>

  <!-- Volume tag -->
  <text x="600" y="548" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#C9A84C" fill-opacity="0.45" letter-spacing="3.5" text-anchor="middle">VOLUME I · 2026</text>

  <!-- Corner marks -->
  <path d="M80,140 L80,130 L90,130" fill="none" stroke="#C9A84C" stroke-width="1" stroke-opacity="0.3"/>
  <path d="M1120,140 L1120,130 L1110,130" fill="none" stroke="#C9A84C" stroke-width="1" stroke-opacity="0.3"/>
  <path d="M80,490 L80,500 L90,500" fill="none" stroke="#C9A84C" stroke-width="1" stroke-opacity="0.3"/>
  <path d="M1120,490 L1120,500 L1110,500" fill="none" stroke="#C9A84C" stroke-width="1" stroke-opacity="0.3"/>
</svg>
