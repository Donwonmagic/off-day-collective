<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="nightbg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0d0b14" stop-opacity="1"/>
      <stop offset="100%" stop-color="#050407" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="lavender-glow" cx="50%" cy="52%" r="45%">
      <stop offset="0%" stop-color="#9B8CC8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#9B8CC8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#nightbg)"/>
  <ellipse cx="600" cy="330" rx="480" ry="280" fill="url(#lavender-glow)"/>

  <!-- Fine rules -->
  <line x1="80" y1="110" x2="1120" y2="110" stroke="#9B8CC8" stroke-width="0.5" stroke-opacity="0.2"/>
  <line x1="80" y1="520" x2="1120" y2="520" stroke="#9B8CC8" stroke-width="0.5" stroke-opacity="0.2"/>

  <!-- Concentric circles — glymphatic / sleep wave motif, anchored bottom-right -->
  <circle cx="980" cy="490" r="30"  fill="none" stroke="#9B8CC8" stroke-width="1.5" stroke-opacity="0.55"/>
  <circle cx="980" cy="490" r="70"  fill="none" stroke="#9B8CC8" stroke-width="1"   stroke-opacity="0.35"/>
  <circle cx="980" cy="490" r="120" fill="none" stroke="#9B8CC8" stroke-width="0.75" stroke-opacity="0.22"/>
  <circle cx="980" cy="490" r="180" fill="none" stroke="#9B8CC8" stroke-width="0.5"  stroke-opacity="0.14"/>
  <circle cx="980" cy="490" r="255" fill="none" stroke="#9B8CC8" stroke-width="0.5"  stroke-opacity="0.08"/>
  <circle cx="980" cy="490" r="350" fill="none" stroke="#9B8CC8" stroke-width="0.5"  stroke-opacity="0.05"/>
  <!-- Center dot -->
  <circle cx="980" cy="490" r="6" fill="#9B8CC8" fill-opacity="0.35"/>

  <!-- Mirror echo — faint circles top-left -->
  <circle cx="220" cy="145" r="40"  fill="none" stroke="#9B8CC8" stroke-width="0.5" stroke-opacity="0.1"/>
  <circle cx="220" cy="145" r="90"  fill="none" stroke="#9B8CC8" stroke-width="0.5" stroke-opacity="0.06"/>

  <!-- ODC logo mark -->
  <g transform="translate(80, 52)">
    <polygon points="32,5 59,20 59,51 32,66 5,51 5,20" fill="none" stroke="#2E6070" stroke-width="3" stroke-linejoin="round"/>
    <polygon points="44,14 55,32 44,50 20,50 9,32 20,14" fill="none" stroke="#2E6070" stroke-width="3" stroke-linejoin="round"/>
    <rect x="26" y="24" width="5" height="16" rx="1" fill="#C05530"/>
    <rect x="33" y="24" width="5" height="16" rx="1" fill="#C05530"/>
  </g>

  <!-- Series label -->
  <text x="150" y="88" font-family="Georgia, 'Times New Roman', serif" font-size="10" fill="#9B8CC8" fill-opacity="0.5" letter-spacing="4">THE SCIENCE OF REST · VOL. I</text>

  <!-- Article number -->
  <text x="520" y="228" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#9B8CC8" fill-opacity="0.45" letter-spacing="5" text-anchor="middle">No. 3 · Evening</text>

  <!-- Main headline -->
  <text x="520" y="318" font-family="Georgia, 'Times New Roman', serif" font-size="64" fill="#F0EDE6" fill-opacity="0.97" letter-spacing="-0.5" text-anchor="middle">The Evening</text>
  <text x="520" y="388" font-family="Georgia, 'Times New Roman', serif" font-size="64" fill="#F0EDE6" fill-opacity="0.97" letter-spacing="-0.5" text-anchor="middle">Protocol.</text>

  <!-- Subtext -->
  <text x="520" y="430" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#F0EDE6" fill-opacity="0.35" letter-spacing="0.3" text-anchor="middle">Glymphatics, melatonin action spectra,</text>
  <text x="520" y="452" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#F0EDE6" fill-opacity="0.35" letter-spacing="0.3" text-anchor="middle">and the real cost of one late drink.</text>

  <!-- Reading time -->
  <text x="520" y="548" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#9B8CC8" fill-opacity="0.4" letter-spacing="3" text-anchor="middle">9 MIN READ · MARCH 2026</text>

  <!-- Corner marks -->
  <path d="M80,140 L80,130 L90,130" fill="none" stroke="#9B8CC8" stroke-width="1" stroke-opacity="0.25"/>
  <path d="M1120,140 L1120,130 L1110,130" fill="none" stroke="#9B8CC8" stroke-width="1" stroke-opacity="0.25"/>
  <path d="M80,490 L80,500 L90,500" fill="none" stroke="#9B8CC8" stroke-width="1" stroke-opacity="0.25"/>
  <path d="M1120,490 L1120,500 L1110,500" fill="none" stroke="#9B8CC8" stroke-width="1" stroke-opacity="0.25"/>
</svg>
