<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="sunrise" cx="50%" cy="85%" r="60%">
      <stop offset="0%" stop-color="#7A3D1A" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#2A1508" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#060504" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gold-orb" cx="50%" cy="80%" r="45%">
      <stop offset="0%" stop-color="#C9A84C" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#C9A84C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="horizon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050403" stop-opacity="1"/>
      <stop offset="100%" stop-color="#100906" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#horizon)"/>
  <rect width="1200" height="630" fill="url(#sunrise)"/>
  <ellipse cx="600" cy="535" rx="500" ry="200" fill="url(#gold-orb)"/>

  <!-- Horizon line -->
  <line x1="0" y1="460" x2="1200" y2="460" stroke="#C9A84C" stroke-width="0.75" stroke-opacity="0.2"/>

  <!-- Sun arc — partial circle rising from horizon -->
  <path d="M 340,460 A 260,260 0 0,1 860,460" fill="none" stroke="#C9A84C" stroke-width="1" stroke-opacity="0.15"/>
  <path d="M 400,460 A 200,200 0 0,1 800,460" fill="none" stroke="#C9A84C" stroke-width="0.5" stroke-opacity="0.1"/>

  <!-- Radiating fine lines from horizon center -->
  <line x1="600" y1="460" x2="200" y2="130" stroke="#C9A84C" stroke-width="0.5" stroke-opacity="0.06"/>
  <line x1="600" y1="460" x2="340" y2="110" stroke="#C9A84C" stroke-width="0.5" stroke-opacity="0.06"/>
  <line x1="600" y1="460" x2="490" y2="105" stroke="#C9A84C" stroke-width="0.5" stroke-opacity="0.06"/>
  <line x1="600" y1="460" x2="600" y2="100" stroke="#C9A84C" stroke-width="0.5" stroke-opacity="0.06"/>
  <line x1="600" y1="460" x2="710" y2="105" stroke="#C9A84C" stroke-width="0.5" stroke-opacity="0.06"/>
  <line x1="600" y1="460" x2="860" y2="110" stroke="#C9A84C" stroke-width="0.5" stroke-opacity="0.06"/>
  <line x1="600" y1="460" x2="1000" y2="130" stroke="#C9A84C" stroke-width="0.5" stroke-opacity="0.06"/>

  <!-- Fine rules -->
  <line x1="80" y1="110" x2="1120" y2="110" stroke="#C9A84C" stroke-width="0.5" stroke-opacity="0.2"/>
  <line x1="80" y1="520" x2="1120" y2="520" stroke="#C9A84C" stroke-width="0.5" stroke-opacity="0.2"/>

  <!-- ODC logo mark -->
  <g transform="translate(80, 52)">
    <!-- Outer hex: pointy-top, r=30.5, center (32, 35.5) -->
    <polygon points="32,5 59,20 59,51 32,66 5,51 5,20" fill="none" stroke="#2E6070" stroke-width="4" stroke-linejoin="round"/>
    <!-- Inner hex: flat-top (30° offset from outer), same center -->
    <polygon points="55,35.5 43.5,15.6 20.5,15.6 9,35.5 20.5,55.4 43.5,55.4" fill="none" stroke="#2E6070" stroke-width="4" stroke-linejoin="round"/>
    <!-- Pause bars: centred at (32, 35.5) -->
    <rect x="24" y="26" width="6" height="19" rx="1" fill="#C05530"/>
    <rect x="33" y="26" width="6" height="19" rx="1" fill="#C05530"/>
  </g>

  <!-- Series label -->
  <text x="150" y="88" font-family="Georgia, 'Times New Roman', serif" font-size="10" fill="#C9A84C" fill-opacity="0.55" letter-spacing="4">THE SCIENCE OF REST · VOL. I</text>

  <!-- Article number -->
  <text x="600" y="228" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#C9A84C" fill-opacity="0.45" letter-spacing="5" text-anchor="middle">No. 1 · Morning</text>

  <!-- Main headline -->
  <text x="600" y="308" font-family="Georgia, 'Times New Roman', serif" font-size="62" fill="#F0EDE6" fill-opacity="0.97" letter-spacing="-0.5" text-anchor="middle">The 90-Minute</text>
  <text x="600" y="372" font-family="Georgia, 'Times New Roman', serif" font-size="62" fill="#F0EDE6" fill-opacity="0.97" letter-spacing="-0.5" text-anchor="middle">Window.</text>

  <!-- Subtext -->
  <text x="600" y="418" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#F0EDE6" fill-opacity="0.4" letter-spacing="0.3" text-anchor="middle">The cortisol awakening response, phone danger zones,</text>
  <text x="600" y="442" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#F0EDE6" fill-opacity="0.4" letter-spacing="0.3" text-anchor="middle">and why your first hour sets the entire day.</text>

  <!-- Reading time -->
  <text x="600" y="548" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#C9A84C" fill-opacity="0.4" letter-spacing="3" text-anchor="middle">8 MIN READ · MARCH 2026</text>

  <!-- Corner marks -->
  <path d="M80,140 L80,130 L90,130" fill="none" stroke="#C9A84C" stroke-width="1" stroke-opacity="0.25"/>
  <path d="M1120,140 L1120,130 L1110,130" fill="none" stroke="#C9A84C" stroke-width="1" stroke-opacity="0.25"/>
  <path d="M80,490 L80,500 L90,500" fill="none" stroke="#C9A84C" stroke-width="1" stroke-opacity="0.25"/>
  <path d="M1120,490 L1120,500 L1110,500" fill="none" stroke="#C9A84C" stroke-width="1" stroke-opacity="0.25"/>
</svg>
